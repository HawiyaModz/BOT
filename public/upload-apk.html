<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upload APK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --primary:#42A5F5; --primary-dark:#1E88E5; --primary-soft:#e3f2fd; --page:#f3f6fb; --surface:#fff; --text:#1f2933; --muted:#6b7280; --border:#e8edf3; --danger:#dc2626; --danger-soft:#fee2e2; --success:#16a34a; --success-soft:#dcfce7; }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Rubik',sans-serif; }
body { min-height:100vh; background:var(--page); display:flex; justify-content:center; }
button, input, textarea { font: inherit; } button { border:0; cursor:pointer; }
.app { width:100%; max-width:420px; min-height:100vh; }
.header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; padding:14px 16px 86px; border-bottom-left-radius:16px; border-bottom-right-radius:16px; }
.header-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.icon { width:38px; height:38px; border-radius:11px; color:#fff; background: rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; }
.header-title { text-align:center; font-size:16px; font-weight:700; }
.user-info { text-align:center; color:#fff; margin-top:10px; font-size:12px; display:flex; align-items:center; justify-content:center; gap:6px; }
.badge-role { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; background: rgba(255,255,255,.25); font-size:10px; font-weight:700; }
.badge-role.admin { background: #f59e0b; color:#fff; }
.content { margin-top:-62px; padding:0 14px 30px; }
.panel { background:var(--surface); border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.08); padding:15px; margin-bottom:14px; }
.panel-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.form-grid { display:grid; gap:11px; }
.field { display:grid; gap:6px; }
.field label { font-size:12px; font-weight:600; color:var(--muted); }
.field input, .field textarea { width:100%; border:1px solid var(--border); border-radius:10px; padding:11px; color:var(--text); background:#fbfdff; outline:none; }
.field textarea { min-height:90px; resize:vertical; line-height:1.5; }
.field input:focus, .field textarea:focus { border-color:var(--primary); background:#fff; }
.field input[type="color"] { padding:3px; height:42px; cursor:pointer; }
.field input[type="file"] { padding:8px; background:#fff; cursor:pointer; font-size:12px; }
.row-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.thumb-wrap { position:relative; display:inline-block; margin:4px; }
.thumb { width:66px; height:66px; object-fit:cover; border-radius:8px; border:1px solid var(--border); background:#fff; }
.thumb-wrap .del { position:absolute; top:-6px; right:-6px; background:#ef4444; color:#fff; width:20px; height:20px; border-radius:50%; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; }
.actions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; }
.message { min-height:18px; font-size:12px; color:var(--muted); flex:1; }
.message.error { color:var(--danger); } .message.success { color:var(--success); }
.submit { min-height:42px; padding:0 18px; border-radius:10px; color:#fff; background:var(--primary); display:inline-flex; align-items:center; gap:8px; font-weight:700; }
.submit:disabled { opacity:.55; cursor:not-allowed; }
.result-box { background: var(--success-soft); border:1px solid #86efac; border-radius:12px; padding:14px; margin-bottom:14px; }
.result-box h3 { color:#15803d; font-size:14px; margin-bottom:8px; }
.result-box .url-row { display:flex; gap:6px; }
.result-box input { flex:1; border:1px solid #86efac; border-radius:8px; padding:9px 10px; background:#fff; font-size:12px; outline:none; }
.result-box .copy-btn { background:var(--success); color:#fff; width:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
.result-box .open-link { display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12px; color:#15803d; font-weight:700; text-decoration:none; }
.section-label { margin: 16px 0 8px; font-size:13px; font-weight:700; color:var(--text); }
.apk-list { display:grid; gap:10px; }
.apk-item { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border); border-radius:10px; background:#fff; }
.apk-item.owned { border-color:#bbf7d0; background:#f0fdf4; }
.apk-item .apk-icon { width:46px; height:46px; border-radius:10px; overflow:hidden; background:var(--primary-soft); flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:18px; }
.apk-item .apk-icon img { width:100%; height:100%; object-fit:cover; }
.apk-item .apk-info { flex:1; min-width:0; }
.apk-item .apk-name { font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.apk-item .apk-meta { font-size:10.5px; color:var(--muted); margin-top:2px; }
.apk-item .apk-owner { display:inline-flex; gap:3px; font-size:9.5px; color:#1e40af; background:#dbeafe; padding:1px 6px; border-radius:999px; margin-left:4px; font-weight:600; }
.apk-item .apk-owner.mine { color:#15803d; background:#dcfce7; }
.apk-item .apk-actions { display:flex; gap:6px; }
.apk-item .apk-btn { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; }
.apk-item .apk-btn.view { background: var(--primary-soft); color: var(--primary); text-decoration:none; }
.apk-item .apk-btn.delete { background: var(--danger-soft); color: var(--danger); }
.empty-list { padding:20px 14px; text-align:center; color:var(--muted); font-size:12px; background:#fbfdff; border-radius:10px; border:1px dashed var(--border); }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-top">
      <a class="icon" href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="header-title">Upload APK</div>
      <button class="icon" onclick="logout()" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
    <div class="user-info">
      <i class="fa-solid fa-user-circle"></i>
      <span id="usernameDisplay">memuat...</span>
      <span id="roleBadge" class="badge-role" hidden><i class="fa-solid fa-crown"></i>ADMIN</span>
    </div>
  </header>

  <main class="content">
    <div id="resultBox" class="result-box" hidden>
      <h3><i class="fa-solid fa-circle-check"></i> Berhasil disimpan!</h3>
      <div class="url-row">
        <input id="resultUrl" readonly>
        <button class="copy-btn" onclick="copyLink()"><i class="fa-solid fa-copy"></i></button>
      </div>
      <a id="openLink" class="open-link" href="#" target="_blank"><i class="fa-solid fa-external-link-alt"></i> Buka halaman APK</a>
    </div>

    <section class="panel">
      <div class="panel-title"><i class="fa-solid fa-mobile-screen-button"></i> Info Aplikasi</div>
      <form id="apkForm" class="form-grid">
        <div class="field"><label>Nama Aplikasi *</label><input id="nama" required></div>
        <div class="field"><label>Developer</label><input id="developer"></div>
        <div class="field"><label>Link Download APK *</label><input id="downloadUrl" type="url" required></div>
        <div class="row-2">
          <div class="field"><label>Rating</label><input id="rating" value="4.9"></div>
          <div class="field"><label>Jumlah Ulasan</label><input id="jmlUlasan" value="827.8K ulasan"></div>
        </div>
        <div class="row-2">
          <div class="field"><label>Ukuran</label><input id="ukuran" value="25 MB"></div>
          <div class="field"><label>Total Download</label><input id="downloads" value="100M+"></div>
        </div>
        <div class="field"><label>Deskripsi Paragraf 1 *</label><textarea id="desc1" required></textarea></div>
        <div class="field"><label>Deskripsi Paragraf 2</label><textarea id="desc2"></textarea></div>
        <div class="field"><label>Apa yang Baru</label><input id="whatsnew" value="Penambahan fitur baru"></div>
        <div class="field"><label>Warna Tema</label><input id="themeColor" type="color" value="#16a34a"></div>
        <div class="section-label"><i class="fa-solid fa-image"></i> Gambar</div>
        <div class="field"><label>Ikon * (1 gambar)</label><input id="fileIcon" type="file" accept="image/*"><div id="iconPreview"></div></div>
        <div class="field"><label>Screenshot (bisa banyak)</label><input id="fileScreenshots" type="file" accept="image/*" multiple><div id="screenshotsPreview"></div></div>
        <div class="actions">
          <div class="message" id="message"></div>
          <button class="submit" id="submitButton" type="submit"><i class="fa-solid fa-paper-plane"></i> Kirim</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-title"><i class="fa-solid fa-list"></i> Daftar APK</div>
      <div id="apkList" class="apk-list"><div class="empty-list">Memuat...</div></div>
    </section>
  </main>
</div>

<script>
var TOKEN = localStorage.getItem("apk_token");
var USER  = JSON.parse(localStorage.getItem("apk_user") || "null");

if (!TOKEN || !USER) {
  window.location.replace("login.html");
}

var iconData = null;
var screenshotData = [];

document.getElementById("usernameDisplay").textContent = "@" + USER.username;
if (USER.role === "admin") {
  var rb = document.getElementById("roleBadge");
  rb.hidden = false; rb.classList.add("admin");
}

function authHeaders() {
  return { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" };
}

function logout() {
  if (!confirm("Yakin mau logout?")) return;
  fetch("/api/logout", { method: "POST", headers: authHeaders() })
    .finally(function () {
      localStorage.removeItem("apk_token");
      localStorage.removeItem("apk_user");
      window.location.replace("login.html");
    });
}
window.logout = logout;

function compressImage(file, maxW, quality) {
  return new Promise(function (resolve) {
    var r = new FileReader();
    r.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement("canvas");
        var w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

document.getElementById("fileIcon").addEventListener("change", function (e) {
  var f = e.target.files[0]; if (!f) return;
  compressImage(f, 400, 0.85).then(function (d) {
    iconData = d;
    document.getElementById("iconPreview").innerHTML =
      '<div class="thumb-wrap"><img src="' + d + '" class="thumb"><span class="del" onclick="removeIcon()">×</span></div>';
  });
});
function removeIcon() { iconData = null; document.getElementById("iconPreview").innerHTML = ""; }
window.removeIcon = removeIcon;

document.getElementById("fileScreenshots").addEventListener("change", function (e) {
  var files = Array.prototype.slice.call(e.target.files);
  Promise.all(files.map(function (f) { return compressImage(f, 720, 0.7); })).then(function (results) {
    results.forEach(function (d) { screenshotData.push(d); });
    renderScreenshots();
    e.target.value = "";
  });
});
function renderScreenshots() {
  document.getElementById("screenshotsPreview").innerHTML = screenshotData.map(function (s, i) {
    return '<div class="thumb-wrap"><img src="' + s + '" class="thumb"><span class="del" onclick="removeScreenshot(' + i + ')">×</span></div>';
  }).join("");
}
function removeScreenshot(i) { screenshotData.splice(i, 1); renderScreenshots(); }
window.removeScreenshot = removeScreenshot;

function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

document.getElementById("apkForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var g = function (id) { return document.getElementById(id).value.trim(); };
  if (!g("nama") || !g("downloadUrl") || !g("desc1")) return setMsg("Isi field bertanda * dulu.", true);
  if (!iconData) return setMsg("Ikon wajib diupload.", true);

  var btn = document.getElementById("submitButton");
  btn.disabled = true; setMsg("Menyimpan...");

  var payload = {
    nama: g("nama"), developer: g("developer") || "Developer",
    downloadUrl: g("downloadUrl"), rating: g("rating") || "5.0",
    jmlUlasan: g("jmlUlasan") || "0 ulasan", ukuran: g("ukuran") || "-",
    downloads: g("downloads") || "-", desc1: g("desc1"), desc2: g("desc2"),
    whatsnew: g("whatsnew") || "-", themeColor: g("themeColor") || "#16a34a",
    icon: iconData, screenshots: screenshotData, reviewsArr: []
  };

  try {
    var res = await fetch("/api/apks", {
      method: "POST", headers: authHeaders(), body: JSON.stringify(payload)
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || "Gagal upload");

    var viewUrl = location.origin + "/view-apk.html?id=" + data.id;
    document.getElementById("resultUrl").value = viewUrl;
    document.getElementById("openLink").href = viewUrl;
    document.getElementById("resultBox").hidden = false;
    document.getElementById("resultBox").scrollIntoView({ behavior: "smooth" });
    setMsg("Berhasil!", false, true);
    document.getElementById("apkForm").reset();
    iconData = null; screenshotData = [];
    document.getElementById("iconPreview").innerHTML = "";
    document.getElementById("screenshotsPreview").innerHTML = "";
    document.getElementById("rating").value = "4.9";
    document.getElementById("jmlUlasan").value = "827.8K ulasan";
    document.getElementById("ukuran").value = "25 MB";
    document.getElementById("downloads").value = "100M+";
    document.getElementById("whatsnew").value = "Penambahan fitur baru";
    document.getElementById("themeColor").value = "#16a34a";
  } catch (err) {
    setMsg("Gagal: " + err.message, true);
  } finally {
    btn.disabled = false;
  }
});

function copyLink() {
  var inp = document.getElementById("resultUrl");
  inp.select(); document.execCommand("copy");
  alert("✅ Link disalin!");
}
window.copyLink = copyLink;

function setMsg(t, isErr, isOk) {
  var m = document.getElementById("message");
  m.textContent = t || "";
  m.className = "message";
  if (isErr) m.classList.add("error");
  if (isOk) m.classList.add("success");
}

/* ---------- LOAD DAFTAR APK ---------- */
async function loadApks() {
  try {
    var res = await fetch("/api/apks");
    var items = await res.json();
    var list = document.getElementById("apkList");

    if (!items.length) {
      list.innerHTML = '<div class="empty-list">Belum ada APK.</div>';
      return;
    }

    list.innerHTML = items.map(function (d) {
      var isMine = d.uploadedByUsername === USER.username;
      var canDelete = isMine || USER.role === "admin";
      var icon = d.icon ? '<img src="' + d.icon + '">' : '<i class="fa-solid fa-mobile-screen-button"></i>';
      var ownerTag = isMine
        ? '<span class="apk-owner mine">Milik saya</span>'
        : '<span class="apk-owner">@' + esc(d.uploadedByUsername || "?") + '</span>';
      var delBtn = canDelete
        ? '<button class="apk-btn delete" onclick="hapusApk(\'' + d.id + '\', \'' + esc(d.nama).replace(/\'/g,"") + '\')"><i class="fa-solid fa-trash"></i></button>' : '';

      return [
        '<div class="apk-item' + (isMine ? ' owned' : '') + '">',
        '  <div class="apk-icon">' + icon + '</div>',
        '  <div class="apk-info">',
        '    <div class="apk-name">' + esc(d.nama) + ownerTag + '</div>',
        '    <div class="apk-meta">' + esc(d.developer || "") + ' · ' + new Date(d.createdAt).toLocaleDateString("id-ID") + '</div>',
        '  </div>',
        '  <div class="apk-actions">',
        '    <a class="apk-btn view" href="view-apk.html?id=' + d.id + '" target="_blank"><i class="fa-solid fa-eye"></i></a>',
        delBtn,
        '  </div>',
        '</div>'
      ].join("");
    }).join("");
  } catch (err) {
    document.getElementById("apkList").innerHTML = '<div class="empty-list">Gagal memuat: ' + err.message + '</div>';
  }
}

async function hapusApk(id, nama) {
  if (!confirm('Hapus "' + nama + '" ?')) return;
  try {
    var res = await fetch("/api/apks/" + id, { method: "DELETE", headers: authHeaders() });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error);
    loadApks();
  } catch (err) {
    alert("❌ " + err.message);
  }
}
window.hapusApk = hapusApk;

loadApks();
</script>
</body>
</html>
