<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Aplikasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { font-family: 'Inter', sans-serif; }
  .app-icon-sm { width: 56px; height: 56px; object-fit: cover; border-radius: 14px; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="bg-white">

<header class="sticky top-0 z-50 bg-white border-b border-gray-100">
  <div class="max-w-3xl mx-auto px-4 py-3">
    <div class="flex items-center gap-3 mb-3">
      <i class="fas fa-shapes text-2xl text-sky-500"></i>
      <h1 class="text-xl font-bold text-gray-800 flex-1">Katalog Aplikasi</h1>
      <a href="login.html" class="text-xs font-semibold text-sky-600 border border-sky-200 px-3 py-1.5 rounded-full hover:bg-sky-50">
        <i class="fas fa-user-shield mr-1"></i>Login
      </a>
    </div>
    <div class="relative">
      <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
      <input id="q" type="text" placeholder="Cari aplikasi..."
        class="w-full pl-11 pr-4 py-2.5 bg-gray-100 rounded-full text-sm outline-none focus:bg-white focus:ring-2 focus:ring-sky-400">
    </div>
  </div>
</header>

<div id="loading" class="flex flex-col items-center justify-center py-20">
  <div class="w-9 h-9 border-3 border-gray-200 border-t-sky-500 rounded-full animate-spin"></div>
  <p class="text-sm text-gray-500 mt-4">Memuat...</p>
</div>

<div id="empty" class="hidden text-center py-20 px-6">
  <i class="fas fa-mobile-screen-button text-6xl text-gray-300 mb-4"></i>
  <h2 class="text-base font-bold text-gray-700">Belum ada aplikasi</h2>
</div>

<main id="list" class="hidden max-w-3xl mx-auto px-4 pb-10 pt-4 space-y-3"></main>

<script>
var allItems = [];
var loading = document.getElementById("loading");
var empty = document.getElementById("empty");
var list = document.getElementById("list");
var qInput = document.getElementById("q");

function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

async function load() {
  try {
    var res = await fetch("/api/apks");
    allItems = await res.json();
    loading.style.display = "none";
    render();
  } catch (err) {
    loading.style.display = "none";
    empty.classList.remove("hidden");
    empty.querySelector("h2").textContent = "Gagal memuat: " + err.message;
  }
}

function render() {
  var q = qInput.value.trim().toLowerCase();
  var items = q
    ? allItems.filter(function (a) {
        return ((a.nama || "") + " " + (a.developer || "") + " " + (a.desc1 || "")).toLowerCase().indexOf(q) !== -1;
      })
    : allItems;

  if (!items.length) {
    list.classList.add("hidden");
    empty.classList.remove("hidden");
    return;
  }
  empty.classList.add("hidden");
  list.classList.remove("hidden");

  list.innerHTML = items.map(function (app) {
    var icon = app.icon || "";
    return [
      '<a href="view-apk.html?id=' + app.id + '" class="flex items-center gap-3 p-2 rounded-2xl hover:bg-gray-50 transition">',
      '  <div class="flex-shrink-0">',
      (icon ? '<img src="' + icon + '" class="app-icon-sm">' : '<div class="app-icon-sm flex items-center justify-center bg-gray-100"><i class="fas fa-mobile-screen-button text-2xl text-gray-300"></i></div>'),
      '  </div>',
      '  <div class="flex-1 min-w-0">',
      '    <div class="text-sm font-semibold text-gray-800 truncate">' + esc(app.nama || "-") + '</div>',
      '    <div class="text-xs text-gray-500 truncate">' + esc(app.developer || "Developer") + '</div>',
      '    <div class="flex items-center gap-3 mt-1 text-[11px] text-gray-500">',
      '      <span><i class="fas fa-star text-[9px] text-gray-800 mr-0.5"></i>' + esc(app.rating || "5.0") + '</span>',
      '      <span>' + esc(app.ukuran || "-") + '</span>',
      '      <span>' + esc(app.downloads || "-") + '</span>',
      '    </div>',
      '  </div>',
      '  <span class="text-xs font-semibold text-sky-600 border border-sky-200 px-3 py-1 rounded-full flex-shrink-0">Buka</span>',
      '</a>'
    ].join("");
  }).join("");
}

qInput.addEventListener("input", render);
load();
</script>
</body>
</html>
