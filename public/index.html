<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bot Web Scanner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        h2 {
            color: #111b21;
            font-size: 22px;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #667781;
            font-size: 14px;
            margin-bottom: 24px;
        }
        #qr-box {
            width: 250px;
            height: 250px;
            border: 2px dashed #00a884;
            border-radius: 12px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            overflow: hidden;
            position: relative;
        }
        #qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #e7fce4;
            color: #008069;
            font-size: 13px;
            font-weight: 500;
        }
        .icon-success {
            font-size: 64px;
            color: #00a884;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>WhatsApp Bot Scanner</h2>
        <p class="subtitle">Scan QR Code di bawah menggunakan WhatsApp kamu untuk mengaktifkan bot.</p>
        
        <div id="qr-box">
            <span style="color: #8696a0; font-size: 14px;">Menghubungkan...</span>
        </div>
        
        <div class="status-badge" id="status">Menunggu respon server...</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const qrBox = document.getElementById('qr-box');
        const statusText = document.getElementById('status');

        socket.on('qr', (qrUrl) => {
            qrBox.innerHTML = `<img src="${qrUrl}" alt="QR Code">`;
        });

        socket.on('status', (msg) => {
            statusText.innerText = msg;
        });

        socket.on('ready', (msg) => {
            qrBox.innerHTML = '<div class="icon-success">✅</div>';
            statusText.innerText = msg;
            statusText.style.backgroundColor = '#d1e7dd';
            statusText.style.color = '#0f5132';
        });
    </script>
</body>
</html>
