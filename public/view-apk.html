<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memuat...</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

<div id="loading" class="flex flex-col items-center justify-center" style="min-height:100vh;">
  <div class="w-11 h-11 border-4 border-gray-200 border-t-green-500 rounded-full animate-spin"></div>
  <p class="text-gray-500 text-sm mt-4">Memuat...</p>
</div>

<div id="error" class="hidden flex-col items-center justify-center p-6 text-center" style="min-height:100vh;">
  <i class="fas fa-circle-exclamation text-red-400 text-5xl mb-4"></i>
  <h1 class="text-xl font-bold text-gray-800">Tidak ditemukan</h1>
</div>

<div id="content" class="hidden"></div>

<script>
function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var id = new URLSearchParams(location.search).get("id");

if (!id) showError();
else {
  fetch("/api/apks/" + id)
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(render)
    .catch(showError);
}

function showError() {
  document.getElementById("loading").style.display = "none";
  var el = document.getElementById("error");
  el.classList.remove("hidden"); el.classList.add("flex");
}

function render(d) {
  document.title = d.nama + " - Download";
  var color = d.themeColor || "#16a34a";
  var iconSrc = d.icon || "";
  if (iconSrc) { var fav = document.createElement("link"); fav.rel = "icon"; fav.href = iconSrc; document.head.appendChild(fav); }

  var screenshotsHTML = (d.screenshots || []).length
    ? '<div class="flex gap-3 mb-6 overflow-x-auto pb-2" style="scrollbar-width:none">' +
      d.screenshots.map(function (s) { return '<img src="' + s + '" class="rounded-xl flex-shrink-0" style="width:130px;height:auto">'; }).join("") + '</div>' : '';

  document.getElementById("content").innerHTML = [
    '<div class="max-w-3xl mx-auto p-6">',
    '  <div class="flex items-start mb-6">',
    '    <div class="w-[72px] h-[72px] rounded-2xl overflow-hidden shadow-md mr-4 flex-shrink-0">',
    (iconSrc ? '<img src="' + iconSrc + '" class="w-full h-full object-cover">' : '<div class="w-full h-full bg-gray-100 flex items-center justify-center"><i class="fas fa-mobile-screen-button text-2xl text-gray-300"></i></div>'),
    '    </div>',
    '    <div class="flex-1">',
    '      <h1 class="text-2xl font-bold text-gray-800">' + esc(d.nama) + '</h1>',
    '      <p class="text-sm text-gray-500 mt-1">Pembelian dalam aplikasi</p>',
    '    </div>',
    '  </div>',
    '  <div class="flex items-center justify-between text-center mb-6 border-b pb-6">',
    '    <div><div class="text-sm font-semibold text-gray-800">' + esc(d.rating) + ' <i class="fas fa-star text-xs"></i></div><p class="text-xs text-gray-500 mt-1">' + esc(d.jmlUlasan) + '</p></div>',
    '    <div class="h-8 w-px bg-gray-200"></div>',
    '    <div><div class="text-sm font-semibold text-gray-800">' + esc(d.ukuran) + '</div><p class="text-xs text-gray-500 mt-1">Ukuran</p></div>',
    '    <div class="h-8 w-px bg-gray-200"></div>',
    '    <div><div class="text-sm font-semibold text-gray-800">' + esc(d.downloads) + '</div><p class="text-xs text-gray-500 mt-1">Download</p></div>',
    '  </div>',
    '  <div class="mb-6"><a href="' + esc(d.downloadUrl) + '" download class="block text-white font-medium py-2.5 px-6 rounded-xl text-center w-full" style="background:' + color + '">Install</a></div>',
    screenshotsHTML,
    '  <div class="mb-6">',
    '    <h2 class="text-lg font-bold text-gray-800 mb-3">Tentang Aplikasi ini</h2>',
    '    <div class="text-sm text-gray-600 leading-relaxed">' + (d.desc1 ? '<p class="mb-3">' + esc(d.desc1) + '</p>' : '') + (d.desc2 ? '<p>' + esc(d.desc2) + '</p>' : '') + '</div>',
    '  </div>',
    '  <div class="mb-2 border-t pt-6"><h2 class="text-lg font-bold text-gray-800 mb-2">Apa yang baru</h2><p class="text-sm text-gray-600">' + esc(d.whatsnew) + '</p></div>',
    '  <div class="pt-2 pb-12"><p class="text-sm text-gray-500">' + new Date().getFullYear() + ' © ' + esc(d.developer) + '</p></div>',
    '</div>'
  ].join("");

  document.getElementById("loading").style.display = "none";
  document.getElementById("content").classList.remove("hidden");
}
</script>
</body>
</html>
